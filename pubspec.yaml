name: agent_arcade_lab
description: "A reproducible playground for model decisions in Tetris and Snake."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - reports/manual-baseline.json
    - reports/prompt-study/priority/benchmark.json
